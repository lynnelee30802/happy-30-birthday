<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF3E8" />
  <meta name="description" content="A small birthday gift for Chapter 30." />
  <title>Happy 30th Birthday</title>
  <link rel="stylesheet" href="./style.css?v=20260814-02" />
  <link rel="stylesheet" href="./mobile.css?v=20260814-02" />
  <link rel="stylesheet" href="./page3.css?v=20260820-02" />
</head>
<body>
  <main id="app">
    <!-- Page 1 | Opening -->
    <section class="page page-opening" id="opening" aria-labelledby="opening-title">
      <div class="opening-blob opening-blob--pink" aria-hidden="true"></div>
      <div class="opening-blob opening-blob--blue" aria-hidden="true"></div>
      <div class="opening-grain" aria-hidden="true"></div>

      <div class="opening-shell">
        <div class="opening-copy">
          <h1 class="display-title reveal reveal--1" id="opening-title">Happy 30th Birthday!</h1>

          <p class="opening-lead reveal reveal--2">
            Your 20s are officially wrapped.<br />
            <span>Welcome to Chapter 30.</span>
          </p>

          <button class="button button--primary reveal reveal--3" id="beginButton" type="button" aria-label="Begin the birthday story">
            <span>Begin</span>
            <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M14 7l5 5-5 5" />
            </svg>
          </button>
        </div>

        <div class="opening-visual reveal reveal--4">
          <div class="photo-sticker photo-sticker--top reveal-sticker" aria-hidden="true">30 looks good on you</div>

          <figure class="opening-photo photo-frame">
            <img src="./images/opening-photo.jpg" alt="30 歲生日照片" />
            <figcaption>officially entering a new chapter</figcaption>
          </figure>

          <span class="doodle doodle--star" aria-hidden="true">✦</span>
          <span class="doodle doodle--spark" aria-hidden="true">✧</span>
          <span class="doodle doodle--corner-star" aria-hidden="true">✦</span>
        </div>

        <p class="opening-note reveal reveal--5">Made for one very specific person.</p>
      </div>
    </section>

    <!-- Page 2 | Loading Memories -->
    <section class="page page-loading" id="loading-memories" aria-live="polite" hidden>
      <div class="loading-blob loading-blob--pink" aria-hidden="true"></div>
      <div class="loading-blob loading-blob--blue" aria-hidden="true"></div>
      <span class="loading-spark loading-spark--left" aria-hidden="true">✦</span>
      <span class="loading-spark loading-spark--right" aria-hidden="true">✧</span>

      <div class="loading-shell">
        <div class="ready-icon" aria-hidden="true">
          <span class="ready-card ready-card--back"></span>
          <span class="ready-card ready-card--front"></span>
          <span class="ready-icon-spark ready-icon-spark--one">✦</span>
          <span class="ready-icon-spark ready-icon-spark--two">✧</span>
        </div>

        <p class="loading-message" id="loadingMessage">Loading memories...</p>

        <div class="loading-track" id="loadingTrack" role="progressbar" aria-label="Loading memories" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="loading-fill" id="loadingFill">
            <span class="loading-dot" aria-hidden="true"></span>
          </span>
        </div>
      </div>
    </section>

    <!-- Page 3 | Our Story -->
    <section class="page-story" id="our-story" aria-labelledby="story-title">
      <div class="story-shell">
        <header class="story-header">
          <p class="story-kicker">Our Story</p>
          <h2 class="story-title" id="story-title">The Memories We’ve Made</h2>
        </header>

        <div class="story-stage">
          <span class="story-spark story-spark--one" aria-hidden="true">✦</span>
          <span class="story-spark story-spark--two" aria-hidden="true">✧</span>

          <article class="story-card" id="storyCard" aria-live="polite">
            <div class="story-copy">
              <p class="chapter-label" id="chapterLabel">Chapter 01</p>
              <h3 class="chapter-title" id="chapterTitle">Where It All Began</h3>
              <div class="chapter-body" id="chapterBody">
                <p>高一時其實沒有很熟，<br />高二再次同班後，不知不覺就變得很好。</p>
                <p>那時候的我們，無話不談。</p>
              </div>
            </div>

            <figure class="story-photo">
              <img id="chapterImage" src="./images/chapter-01.jpg" alt="高中時期的我們" />
            </figure>
          </article>

          <div class="story-controls">
            <p class="story-progress" id="storyProgress">1 of 6</p>
            <button class="story-next-button" id="storyNextButton" type="button" aria-label="Go to the next chapter">
              <span id="storyNextLabel">Next Chapter</span>
              <span class="story-next-arrow" aria-hidden="true">→</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="./script.js?v=20260820-02"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF3E8" />
  <meta name="description" content="A small birthday gift for Chapter 30." />
  <title>Happy 30th Birthday</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./mobile.css" />
</head>
<body>
  <main id="app">
    <!-- Page 1 | Opening -->
    <section class="page page-opening" id="opening" aria-labelledby="opening-title">
      <div class="opening-blob opening-blob--pink" aria-hidden="true"></div>
      <div class="opening-blob opening-blob--blue" aria-hidden="true"></div>
      <div class="opening-grain" aria-hidden="true"></div>

      <div class="opening-shell">
        <div class="opening-copy">
          <h1 class="display-title reveal reveal--1" id="opening-title">Happy 30th Birthday!</h1>

          <p class="opening-lead reveal reveal--2">
            Your 20s are officially wrapped.<br />
            <span>Welcome to Chapter 30.</span>
          </p>

          <button class="button button--primary reveal reveal--3" id="beginButton" type="button" aria-label="Begin the birthday story">
            <span>Begin</span>
            <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M14 7l5 5-5 5" />
            </svg>
          </button>
        </div>

        <div class="opening-visual reveal reveal--4">
          <div class="photo-sticker photo-sticker--top reveal-sticker" aria-hidden="true">30 looks good on you</div>

          <figure class="opening-photo photo-frame">
            <img
              src="./images/opening-photo.jpg"
              alt="30 歲生日照片"
            />
            <figcaption>officially entering a new chapter</figcaption>
          </figure>

          <span class="doodle doodle--star" aria-hidden="true">✦</span>
          <span class="doodle doodle--spark" aria-hidden="true">✧</span>
          <span class="doodle doodle--corner-star" aria-hidden="true">✦</span>
        </div>

        <p class="opening-note reveal reveal--5">Made for one very specific person.</p>
      </div>
    </section>

    <!-- Page 2 | Loading Memories -->
    <section class="page page-loading" id="loading-memories" aria-labelledby="loading-title">
      <div class="loading-blob loading-blob--pink" aria-hidden="true"></div>
      <div class="loading-blob loading-blob--blue" aria-hidden="true"></div>
      <span class="loading-spark loading-spark--one" aria-hidden="true">✦</span>
      <span class="loading-spark loading-spark--two" aria-hidden="true">✧</span>

      <div class="loading-shell">
        <p class="loading-kicker">MEMORY ARCHIVE</p>
        <h2 class="loading-title" id="loading-title">Loading Memories...</h2>

        <div class="loading-interface" aria-live="polite">
          <div class="loading-meta">
            <span class="loading-status" id="loadingStatus">Loading memories...</span>
            <span class="loading-percent" id="loadingPercent">0%</span>
          </div>

          <div class="loading-track" role="progressbar" aria-label="Loading memories" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="loadingTrack">
            <span class="loading-bar" id="loadingBar"></span>
          </div>
        </div>

        <div class="loading-complete" id="loadingComplete" aria-hidden="true">
          <span class="loading-check" aria-hidden="true">✓</span>
          <p class="loading-done">Done.</p>
          <p class="loading-ready">Your story is ready.</p>
        </div>
      </div>
    </section>

    <!-- Page 3 will be inserted here after Page 2 is confirmed. -->
    <section id="our-story" class="page-placeholder" aria-hidden="true"></section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
